[tool.poetry]
name = "idea-gen-lib"
version = "0.1.0"
description = "Standalone idea generation pipeline library"
authors = ["Your Name <jackhorse1000@gmail.com>"]
readme = "README.md"
packages = [{include = "ideagen"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
openai = "^1.0"
pydantic = "^2.0"
python-dotenv = "^1.0"
sentence-transformers = "^2.0"
numpy = ">=1.23,<2.0"
tqdm = "^4.0"
click = "^8.0"
torch = "^2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
pytest-asyncio = "^0.23"

[tool.poetry.scripts]
ideagen = "ideagen.cli:main"
